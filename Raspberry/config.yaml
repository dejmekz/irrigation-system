mqtt:
  host: localhost
  port: 1883
  username: ""   # override with MQTT_USER env var
  password: ""   # override with MQTT_PASS env var
  client_id: irrigation_pi

# 4 boxes x 3 valves = 12 outputs + pump
# Mapped across two PCF8574 I2C expanders on ESP32
system:
  boxes: 4
  valves_per_box: 3
  max_script_duration: 7200  # seconds; script is force-stopped if it exceeds this
  # Must match VALVE_MAX_ON_MS in ESP32/src/config.h. The firmware closes and
  # latches any valve held open this long, so a script that would exceed it is
  # rejected at save time rather than silently running dry for the remainder.
  valve_max_on: 3600         # seconds

web:
  host: "0.0.0.0"
  port: 5000
  secret_key: ""  # override with SECRET_KEY env var

# OTA firmware. The .bin is served statically by the Apache already running on
# this host, not by Flask: the Werkzeug dev server truncates a 1 MB download to
# a slow client like the ESP32, which then fails its image check and rolls back.
# `dir` is written by /firmware/upload and read by that static server.
# `host`/`port` are stamped into manifest.json and tell the ESP32 where to fetch
# the binary. Empty dir = ./firmware (local dev only).
firmware:
  dir: /var/www/html/firmware
  host: raspi4server.local
  port: 80
