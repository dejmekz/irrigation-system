# Serves the ESP32 OTA firmware image statically.
#
# Why this exists: the Flask app runs on the Werkzeug dev server, which writes a
# 1 MB response into the socket, logs 200, and lets the connection be cut before
# a client as slow as the ESP32 has drained it. The truncated image then fails
# its checksum in Update.end() and the device rolls back. Static serving makes
# the OTA deterministic instead of load-dependent.
#
# Apache already owns port 80 on this host, so nginx listens on 8090 and serves
# nothing else. Flask (port 5000) still owns /firmware/upload and
# /firmware/trigger; only the static reads live here.
#
# Install:
#   sudo cp nginx-firmware.conf /etc/nginx/sites-available/firmware.conf
#   sudo ln -sf /etc/nginx/sites-available/firmware.conf /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default   # would collide with Apache on :80
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen      8090;
    listen [::]:8090;
    server_name _;

    # /firmware/irrigation.bin -> /var/www/html/firmware/irrigation.bin
    # Directory is already openhabian-writable and www-data-readable, so the
    # upload endpoint needs no privileges to replace the image.
    root /var/www/html;

    access_log /var/log/nginx/firmware-access.log;
    error_log  /var/log/nginx/firmware-error.log;

    # Expose the firmware directory and nothing else on this port.
    location / {
        return 404;
    }

    location /firmware/ {
        autoindex off;
        # The ESP32 reads far slower than the disk; give the transfer room
        # rather than letting it time out midway through the image.
        send_timeout 120s;
        # Always hand out the image that is on disk right now.
        add_header Cache-Control "no-store" always;
    }
}
